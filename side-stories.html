<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="《天气预报都是骗人的》支线故事档案"><title>支线故事｜天气预报都是骗人的</title><style>

</style></head><body><header class="top"><b>支线故事档案</b><a href="index.html#story">← 返回首页</a></header><section class="hero"><small>SIDE STORY ARCHIVE</small><h1>主线之外的天气</h1><p>这里将收录人物日常、过去经历与未被公开的气象记录。</p><div class="line"></div><div class="filters"><span>全部</span><span>人物支线</span><span>日常片段</span><span>时间线补充</span></div></section><main id="story-archive" class="archive"><section class="empty"><div class="symbol">＋</div><h2>支线档案等待收录</h2><p>模块已经准备完成。你在作者后台新增支线故事后，会自动显示在这里。</p></section></main><script>
const safe=value=>String(value??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const paragraphs=value=>safe(value).replace(/\r?\n/g,'<br>');

</script></body></html>
